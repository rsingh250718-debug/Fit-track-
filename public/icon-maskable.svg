<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gold-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for adaptive Android mask -->
  <rect width="512" height="512" fill="url(#bg-mask)" />

  <!-- Centered safe zone symbol (15% margin safe) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Shield -->
    <path d="M256 64 L416 128 V272 C416 368 256 448 256 448 C256 448 96 368 96 272 V128 Z" 
          fill="#18181b" stroke="#3f3f46" stroke-width="16" />

    <!-- Lightning Bolt -->
    <path d="M280 120 L160 270 H270 L232 392 L352 242 H242 Z" 
          fill="url(#gold-mask)" />
  </g>
</svg>
